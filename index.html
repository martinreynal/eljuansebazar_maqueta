<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="El Juanse Bazar · Bazar a medida. Vajilla, cocina, organización, deco y artículos para el hogar, con opción de personalización con logo. Cotizaciones por WhatsApp.">
<meta name="theme-color" content="#F7F4EE">
<meta property="og:type" content="website">
<meta property="og:title" content="El Juanse Bazar · Bazar a medida">
<meta property="og:description" content="Catálogo de bazar, cocina y hogar. Productos personalizados con tu logo. Cotizaciones por WhatsApp.">
<meta property="og:image" content="/og-image.png">
<meta property="og:locale" content="es_AR">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>El Juanse Bazar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: vitrina de bazar — góndola de 1240px, tarjetas sin sombra sobre piedra cálida, acento azul enlozado solo para promociones */
:root{
  --bg:#F7F4EE; --surface:#FFFDF9; --sand:#EEE7DB; --stone:#D8D0C3; --muted:#8C8478; --ink:#2A2724; --ink-2:#5D5750; --line:#E5DED2;
  --promo:#2F4E8C; --promo-soft:#E5EAF3; --wa:#1E8A52; --wa-ink:#FFFFFF; --wa-soft:#E2F0E7;
  --ok:#3B7A4E; --warn:#A2650F; --bad:#A23A2F; --overlay:rgba(30,27,24,.42);
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-sm:7px; --r:11px; --r-lg:18px; --logo-l:block; --logo-d:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1917; --surface:#22201E; --sand:#2B2825; --stone:#3A3631; --muted:#958C80; --ink:#F1ECE4; --ink-2:#BDB4A8; --line:#34302B;
  --promo:#93ABDB; --promo-soft:#232B3A; --wa:#2BA866; --wa-ink:#0E1A13; --wa-soft:#1B3024;
  --ok:#6FB685; --warn:#D9A04A; --bad:#E07F72; --overlay:rgba(0,0,0,.6); --logo-l:none; --logo-d:block; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1A1917; --surface:#22201E; --sand:#2B2825; --stone:#3A3631; --muted:#958C80; --ink:#F1ECE4; --ink-2:#BDB4A8; --line:#34302B;
  --promo:#93ABDB; --promo-soft:#232B3A; --wa:#2BA866; --wa-ink:#0E1A13; --wa-soft:#1B3024;
  --ok:#6FB685; --warn:#D9A04A; --bad:#E07F72; --overlay:rgba(0,0,0,.6); --logo-l:none; --logo-d:block; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
@media (max-width:480px){.wrap{padding-inline:16px}}
svg{display:block}
.lucide{width:20px;height:20px;stroke-width:1.75;flex:none}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.02em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.only-m{display:none!important}
@media (max-width:860px){.only-m{display:flex!important}.only-d{display:none!important}}

/* demo strip */
.demo-strip{background:var(--ink);color:var(--bg);font-size:12.5px;text-align:center;padding:7px 16px;font-weight:600;letter-spacing:.01em}
.demo-strip span{opacity:.7;font-weight:500}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:20px;height:76px}
.logo{display:flex;align-items:center;gap:12px;flex:none}
.logo-img{height:58px;width:auto}
.logo-img.l{display:var(--logo-l)}.logo-img.d{display:var(--logo-d)}
.logo-tag{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding-left:12px;border-left:1px solid var(--line);line-height:1.2;max-width:90px}
.ftr .logo-img{height:64px}
.login .logo-img{height:72px}
@media (max-width:860px){.logo-img{height:40px}.logo-tag{display:none}}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.04em}
.logo-name{font-weight:800;font-size:17px;letter-spacing:-.03em;line-height:1}
.logo-name small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-top:3px}
.nav{display:flex;gap:4px}
.nav a{padding:8px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2);transition:background .15s,color .15s}
.nav a:hover,.nav a[aria-current="page"]{background:var(--sand);color:var(--ink)}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:42px;min-width:0;transition:border-color .15s}
.search:focus-within{border-color:var(--ink-2)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px}
.search .lucide{color:var(--muted);width:18px;height:18px}
.hdr-actions{display:flex;align-items:center;gap:6px;flex:none}
.icon-btn{position:relative;width:42px;height:42px;border-radius:999px;border:0;background:none;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.icon-btn:hover{background:var(--sand)}
.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.badge[data-n="0"]{display:none}
.cats-bar{border-top:1px solid var(--line)}
.cats-bar .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;height:44px;align-items:center}
.cats-bar a{white-space:nowrap;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2);border-radius:999px}
.cats-bar a:hover{color:var(--ink);background:var(--sand)}
.cats-bar a.promo{color:var(--promo)}
@media (max-width:860px){.hdr-in{gap:8px;height:60px}.search{display:none}.logo-name small{display:none}}
.m-search{padding-block:0 12px}
.m-search .search{display:flex}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:transform .12s,background .15s,border-color .15s,color .15s}
.btn:active{transform:scale(.98)}
.btn .lucide{width:18px;height:18px}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-dark:hover{background:var(--ink-2)}
.btn-wa{background:var(--wa);color:var(--wa-ink)}
.btn-wa:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;border-color:var(--stone);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-2);background:var(--surface)}
.btn-soft{background:var(--sand);color:var(--ink)}
.btn-soft:hover{background:var(--stone)}
.btn-sm{height:36px;padding:0 14px;font-size:13px}
.btn-block{width:100%}
.btn-lg{height:52px;font-size:15px;padding:0 24px}
.link-btn{background:none;border:0;padding:0;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2)}

/* sections */
main{min-height:60vh}
.sec{padding-block:44px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}
.sec-head h2{font-size:clamp(22px,2.6vw,30px);font-weight:800}
.sec-head p{color:var(--ink-2);margin-top:6px;max-width:52ch}
.sec-head a{font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;padding-block:28px 12px;align-items:stretch}
.hero-copy{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(24px,4vw,52px);display:flex;flex-direction:column;justify-content:center;gap:18px;min-width:0}
.hero h1{font-size:clamp(32px,4.6vw,56px);font-weight:800;letter-spacing:-.035em;line-height:1.02}
.hero p{color:var(--ink-2);font-size:16.5px;max-width:46ch}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.hero-facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px;padding-top:18px;border-top:1px solid var(--line)}
.hero-facts div{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.hero-facts .lucide{width:17px;height:17px;color:var(--ink)}
.hero-art{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-height:420px}
.hero-art a{border-radius:var(--r-lg);overflow:hidden;position:relative;display:block}
.hero-art a:first-child{grid-row:span 2}
.hero-art svg,.hero-art img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.hero-art a:hover svg{transform:scale(1.03)}
.hero-art .cap{position:absolute;left:12px;bottom:12px;background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center}
@media (max-width:860px){.hero{grid-template-columns:1fr}.hero-art{min-height:300px;order:-1}}
@media (max-width:480px){.hero-art{min-height:240px}}

/* categories */
.cat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.cat-tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.cat-tile .ph{width:100%;aspect-ratio:1;border-radius:var(--r);overflow:hidden;transition:transform .2s}
.cat-tile:hover .ph{transform:translateY(-3px)}
.cat-tile b{font-size:14px;font-weight:700}
.cat-tile span{font-size:12.5px;color:var(--muted);margin-top:-8px}
@media (max-width:1000px){.cat-grid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:560px){.cat-grid{grid-template-columns:repeat(3,1fr);gap:10px}}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 16px}
@media (max-width:1060px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.card-media{position:relative;display:block;aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--sand)}
.card-media svg,.card-media img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.card:hover .card-media svg,.card:hover .card-media img{transform:scale(1.04)}
.tag{position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:6px;background:var(--surface);color:var(--ink)}
.tag-oferta{background:var(--promo);color:var(--surface)}
.tag-nuevo{background:var(--ink);color:var(--bg)}
.fav-btn{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:999px;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.fav-btn:hover{transform:scale(1.08)}
.fav-btn .lucide{width:18px;height:18px}
.fav-btn.on .lucide{fill:var(--bad);stroke:var(--bad)}
.card-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.card-cat{font-size:12px;color:var(--muted);font-weight:600}
.card-sku{color:var(--ink-2);font-weight:500}
.card-desc{font-size:13px;color:var(--ink-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.card h3{font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.card h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.price{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.price s{font-weight:500;font-size:13px;color:var(--muted)}
.price.ask{font-weight:600;font-size:13.5px;color:var(--ink-2)}
.avail{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.avail i.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.avail.sin-stock i.dot{background:var(--bad)}
.avail.consultar i.dot{background:var(--warn)}
.card-actions{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:4px}
.card-actions .btn{height:38px;padding:0 12px;font-size:13px}
.sq{width:38px;padding:0!important}
.wa-soft{background:var(--wa-soft);color:var(--wa)}
.wa-soft:hover{background:var(--wa);color:var(--wa-ink)}
@media (max-width:420px){.card-actions{grid-template-columns:1fr 1fr}.card-actions .view{grid-column:span 2}.sq{width:auto}}

/* offers band */
.band{background:var(--promo-soft);border-radius:var(--r-lg);padding:clamp(20px,3vw,36px)}
.band .sec-head h2{color:var(--promo)}

/* ranking */
.rank{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
.rank a{display:grid;grid-template-columns:36px 64px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rank .n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.rank .t{width:64px;height:64px;border-radius:var(--r-sm);overflow:hidden}
.rank b{font-size:14.5px;display:block}
.rank small{color:var(--muted);font-size:12.5px}
.rank .lucide{color:var(--muted)}
@media (max-width:760px){.rank{grid-template-columns:1fr}}

/* wa banner */
.wa-banner{background:var(--ink);color:var(--bg);border-radius:var(--r-lg);padding:clamp(24px,4vw,48px);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.wa-banner h2{font-size:clamp(24px,3vw,36px);font-weight:800;letter-spacing:-.03em}
.wa-banner p{opacity:.75;margin-top:8px;max-width:50ch}
.wa-banner .steps{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:13px;opacity:.85}
.wa-banner .steps span{display:flex;align-items:center;gap:6px}
@media (max-width:720px){.wa-banner{grid-template-columns:1fr}}

/* info */
.info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.info > div{border-top:2px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.info h4{font-size:13px;font-weight:800;display:flex;gap:8px;align-items:center}
.info p{color:var(--ink-2);font-size:14px;overflow-wrap:anywhere}
@media (max-width:860px){.info{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.info{grid-template-columns:1fr}}

/* breadcrumbs */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);padding-block:18px 6px}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs .lucide{width:14px;height:14px}
.crumbs span:last-child{color:var(--ink);font-weight:600}

/* catalog */
.cat-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;padding-bottom:48px}
.page-title{font-size:clamp(28px,3.6vw,40px);font-weight:800;letter-spacing:-.03em;margin-block:4px 18px}
.filters{display:flex;flex-direction:column;gap:22px;align-self:start;position:sticky;top:130px}
.f-group h4{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.check{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.check em{margin-left:auto;font-style:normal;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.price-in{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.input,select.input,textarea.input{height:42px;border:1px solid var(--stone);background:var(--surface);border-radius:var(--r-sm);padding:0 12px;font-size:14px;width:100%;min-width:0}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus{outline:none;border-color:var(--ink)}
.hint{font-size:12px;color:var(--muted)}
.cat-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.cat-top .search{flex:1 1 260px;display:flex;height:44px}
.cat-top select{width:auto;height:44px;border-radius:999px;padding:0 14px}
.result-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;font-size:13.5px;color:var(--ink-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:999px;background:var(--sand);font-size:13px;font-weight:600;border:0;cursor:pointer}
.chip .lucide{width:15px;height:15px}
.chip:hover{background:var(--stone)}
.load-more{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:32px;font-size:13px;color:var(--muted)}
.progress{width:180px;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink)}
.sheet-bg{display:none}
@media (max-width:860px){
  .cat-layout{grid-template-columns:1fr}
  .filters{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:70;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:82vh;overflow:auto;transform:translateY(105%);transition:transform .28s ease}
  .filters.open{transform:none}
  .sheet-bg.open{display:block;position:fixed;inset:0;background:var(--overlay);z-index:65}
  .f-head{justify-content:space-between;align-items:center;font-weight:800;font-size:18px}
}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--sand) 0%,var(--line) 50%,var(--sand) 100%);background-size:200% 100%;animation:sh 1.2s infinite linear;border-radius:var(--r)}
@keyframes sh{to{background-position:-200% 0}}
.sk-card{display:flex;flex-direction:column;gap:10px}
.sk-card .a{aspect-ratio:1}.sk-card .b{height:14px;width:70%;border-radius:4px}.sk-card .c{height:14px;width:40%;border-radius:4px}

/* empty */
.empty{text-align:center;padding:56px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;border:1px dashed var(--stone);border-radius:var(--r-lg)}
.empty .ic{width:56px;height:56px;border-radius:999px;background:var(--sand);display:grid;place-items:center}
.empty h3{font-size:19px;font-weight:800}
.empty p{color:var(--ink-2);max-width:44ch}

/* product page */
.pdp{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:44px;padding-block:8px 40px}
.gallery{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-self:start;position:sticky;top:130px}
.thumbs{display:flex;flex-direction:column;gap:10px}
.thumbs button{border:2px solid transparent;border-radius:var(--r-sm);overflow:hidden;padding:0;cursor:pointer;aspect-ratio:1;background:none}
.thumbs button[aria-current="true"]{border-color:var(--ink)}
.thumbs svg,.thumbs img{width:100%;height:100%;object-fit:cover}
.main-img{border-radius:var(--r-lg);overflow:hidden;aspect-ratio:1;background:var(--sand)}
.main-img svg,.main-img img{width:100%;height:100%;object-fit:cover;animation:fade .3s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.pinfo{display:flex;flex-direction:column;gap:18px;min-width:0}
.pinfo h1{font-size:clamp(26px,3.2vw,38px);font-weight:800;letter-spacing:-.03em}
.pinfo .meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}

function art(p, view=0, label=true){
  if (p.photos && p.photos.length){ const src = p.photos[Math.min(view, p.photos.length-1)]; return `<img src="${src}" alt="${esc(p.name)}">`; }
  const c=p.color, d=shade(c,-.22), l=shade(c,.38), bg=view===2?shade(p.bg,-.05):p.bg;
  const tf = view===1 ? 'transform="translate(-110 -132) scale(1.55)"' : '';
  const table = view===2 ? `<rect x="0" y="312" width="400" height="88" fill="${shade(p.bg,-.12)}"/>` : '';
  const body = (SH[p.kind]||SH.box)(c,d,l,bg);
  return `<svg viewBox="0 0 400 400" role="img" aria-label="${esc(p.name)} (imagen ilustrativa)" preserveAspectRatio="xMidYMid slice"><rect width="400" height="400" fill="${bg}"/>${table}<g ${tf}><ellipse cx="200" cy="322" rx="128" ry="12" fill="#000" opacity=".07"/>${body}</g>${label?'<text x="14" y="388" font-family="DM Mono,monospace" font-size="11" fill="#000" opacity=".32" letter-spacing="1.2">IMAGEN ILUSTRATIVA</text>':''}</svg>`;
}

function brandMark(ex, size){
  const k=ex.ink, s=size;
  const m = ex.mark==='circle' ? `<circle cx="0" cy="0" r="${s}" fill="none" stroke="${k}" stroke-width="${s*.22}"/><circle cx="0" cy="0" r="${s*.38}" fill="${k}"/>`
    : ex.mark==='square' ? `<rect x="${-s}" y="${-s}" width="${s*2}" height="${s*2}" rx="${s*.3}" fill="none" stroke="${k}" stroke-width="${s*.2}"/><path d="M${-s*.45} ${s*.45}L${s*.45} ${-s*.45}" stroke="${k}" stroke-width="${s*.2}"/>`
    : ex.mark==='triangle' ? `<path d="M0 ${-s}L${s*1.1} ${s*.8}H${-s*1.1}Z" fill="${k}"/><path d="M${-s*.35} ${s*.8}L0 ${s*.1}L${s*.35} ${s*.8}Z" fill="${ex.color}"/>`
    : `<path d="M0 ${s}C${-s*1.1} ${s*.2} ${-s*.6} ${-s} 0 ${-s}C${s*.6} ${-s} ${s*1.1} ${s*.2} 0 ${s}Z" fill="${k}"/><path d="M0 ${s*.8}V${-s*.5}" stroke="${ex.color}" stroke-width="${s*.12}"/>`;
  return m;
}
function customArt(ex){
  const c=ex.color, d=shade(c,-.18), l=shade(c,.35);
  const body=(SH[ex.kind]||SH.box)(c,d,l,ex.bg);
  const pos = {mug:[200,240,0,1], board:[200,232,-8,1.05], glass:[200,262,0,.8], jar:[205,262,0,.8]}[ex.kind]||[200,240,0,1];
  const [x,y,r,sc]=pos, op = ex.kind==='board'?.8:1;
  const logo = `<g transform="translate(${x} ${y}) rotate(${r}) scale(${sc})" opacity="${op}"><g transform="translate(0 -14)">${brandMark(ex,13)}</g><text x="0" y="22" text-anchor="middle" font-family="Manrope,system-ui,sans-serif" font-weight="800" font-size="17" letter-spacing=".5" fill="${ex.ink}">${esc(ex.brand.toUpperCase())}</text></g>`;
  return `<svg viewBox="0 0 400 400" role="img" aria-label="Mockup: ${esc(ex.brand)} en ${ex.kind}" preserveAspectRatio="xMidYMid slice"><rect width="400" height="400" fill="${ex.bg}"/><ellipse cx="200" cy="322" rx="128" ry="12" fill="#000" opacity=".07"/>${body}${logo}<text x="14" y="388" font-family="DM Mono,monospace" font-size="11" fill="#000" opacity=".32" letter-spacing="1.2">MOCKUP ILUSTRATIVO</text></svg>`;
}

const cats = () => S.data.categories;
const catById = id => cats().find(c => c.id === id);
const prodBySku = sku => S.data.products.find(p => p.sku === sku);
const prodBySlug = slug => S.data.products.find(p => p.slug === slug);
function isPublic(p){ const c = catById(p.cat); return p.visible && !p.archived && p.avail !== 'discontinuado' && c && c.active; }
const pub = () => S.data.products.filter(isPublic);
function inCat(p, id){ return id === 'ofertas' ? p.tag === 'oferta' : p.cat === id; }
const priceShown = p => S.data.settings.showPrices && p.priceVisible && p.price > 0;
const prodUrl = p => `${S.data.settings.domain.replace(/\/$/,'')}/producto/${p.slug}`;
const waNum = () => S.data.settings.whatsapp.replace(/\D/g,'');
const waLink = text => `https://wa.me/${waNum()}?text=${encodeURIComponent(text)}`;
function waProductMsg(p, variant){
  return `Hola, quería consultar por *${p.name}*${variant?` (${variant})`:''} | Código: ${p.sku}\n${prodUrl(p)}\n\n¿Me podrían pasar una cotización y confirmar disponibilidad? Gracias.`;
}
function waListMsg(){
  const lines = S.list.map(i => { const p = prodBySku(i.sku); if(!p) return ''; return `• ${p.name}${i.variant?` (${i.variant})`:''} | Código: ${p.sku} | Cantidad: ${i.qty}\n  ${prodUrl(p)}`; }).filter(Boolean);
  return `Hola, quería consultar por los siguientes productos:\n\n${lines.join('\n')}\n\n¿Me podrían pasar una cotización y confirmar disponibilidad? Gracias.`;
}

const logoImg = () => `<img class="logo-img l" src="${LOGO_L}" alt="${esc(S.data.settings.name)}"><img class="logo-img d" src="${LOGO_D}" alt="" aria-hidden="true">`;
const ADMIN_HASH='00f0f44ef9c8a80dc9cfb3852d99513902429ea854e1a9517bdcad557431a225';
const PDF_URL = 'catalogo-el-juanse-bazar.pdf';
const pdfBtn = (cls='btn-ghost') => `<a class="btn ${cls}" href="${PDF_URL}" target="_blank" rel="noopener">${ic('file-down')}Descargar catálogo en PDF</a>`;
const ic = (n, cls='') => `<i data-lucide="${n}" class="${cls}"></i>`;
function tagEl(p){ return p.tag ? `<span class="tag tag-${p.tag}">${TAGS[p.tag]}</span>` : ''; }
function priceEl(p){
  if(!priceShown(p)) return `<div class="price ask">Precio a cotizar</div>`;
  return `<div class="price">${money(p.price)}${p.tag==='oferta'&&p.oldPrice?`<s>${money(p.oldPrice)}</s>`:''}</div>`;
}
const availEl = p => `<span class="avail ${p.avail}"><i class="dot"></i>${AV[p.avail]}</span>`;
const shortDesc = p => { const t=(p.desc||'').split(/(?<=\.)\s/)[0]; return t.length>110 ? t.slice(0,107).replace(/\s\S*$/,'')+'…' : t; };
function card(p){
  const fav = S.favs.includes(p.sku);
  return `<article class="card">
    <a class="card-media" href="#producto-${p.slug}" aria-label="Ver ${esc(p.name)}">${art(p)}${tagEl(p)}</a>
    <button class="fav-btn ${fav?'on':''}" data-action="fav" data-sku="${p.sku}" aria-pressed="${fav}" aria-label="${fav?'Quitar de':'Agregar a'} favoritos">${ic('heart')}</button>
    <div class="card-body">
      <span class="card-cat"><span class="mono card-sku">${p.sku}</span> · ${esc(catById(p.cat)?.name||'')}</span>
      <h3><a href="#producto-${p.slug}">${esc(p.name)}</a></h3>
      <p class="card-desc">${esc(shortDesc(p))}</p>
      ${priceShown(p)?priceEl(p):''}
      ${p.avail!=='disponible'?availEl(p):''}
    </div>
    <div class="card-actions">
      <a class="btn btn-ghost view" href="#producto-${p.slug}">Ver producto</a>
      <a class="btn wa-soft sq" href="${waLink(waProductMsg(p))}" target="_blank" rel="noopener" data-wa="product" data-sku="${p.sku}" aria-label="Pedir cotización de ${esc(p.name)} por WhatsApp" title="Pedir cotización por WhatsApp">${ic('message-circle')}</a>
      <button class="btn btn-soft sq" data-action="add" data-sku="${p.sku}" aria-label="Agregar ${esc(p.name)} a la lista de consulta" title="Agregar a la lista de consulta">${ic('list-plus')}</button>
    </div>
  </article>`;
}
const grid = list => `<div class="grid">${list.map(card).join('')}</div>`;
function empty(icon, title, text, cta=''){ return `<div class="empty"><div class="ic">${ic(icon)}</div><h3>${title}</h3><p>${text}</p>${cta}</div>`; }
function crumbs(items){ return `<nav class="crumbs" aria-label="Ruta de navegación">${items.map((it,i)=> i<items.length-1 ? `<a href="${it[1]}">${esc(it[0])}</a>${ic('chevron-right')}` : `<span aria-current="page">${esc(it[0])}</span>`).join('')}</nav>`; }

/* ==========================================================================
   SHELL: header, footer, tabbar
   ========================================================================== */
function renderShell(){
  const st = S.data.settings;
  const initials = st.name.split(/\s+/).filter(w=>!/^(el|la|los|las|de|del)$/i.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase() || 'B';
  $('#hdr').innerHTML = `
    <div class="wrap hdr-in">
      <button class="icon-btn only-m" data-action="menu" aria-label="Abrir menú">${ic('menu')}</button>
      <a href="#inicio" class="logo" aria-label="${esc(st.name)}, inicio">${logoImg()}<span class="logo-tag">${esc(st.tagline)}</span></a>
      <nav class="nav only-d" aria-label="Secciones">
        <a href="#inicio" data-nav="inicio">Inicio</a><a href="#catalogo" data-nav="catalogo">Catálogo</a><a href="#ofertas" data-nav="ofertas">Ofertas</a><a href="#personalizados" data-nav="personalizados">Personalizados</a><a href="#faq" data-nav="faq">Preguntas</a>
      </nav>
      <form class="search" role="search" data-action="noop" onsubmit="return false">${ic('search')}<input id="hdr-q" type="search" placeholder="Buscar por SKU o palabra clave (ej: V001, frascos)" aria-label="Buscar productos" data-input="q" autocomplete="off"></form>
      <div class="hdr-actions">
        <button class="icon-btn only-m" data-action="m-search" aria-label="Buscar">${ic('search')}</button>
        <a class="icon-btn only-d" href="#favoritos" aria-label="Favoritos">${ic('heart')}<span class="badge" data-count="favs"></span></a>
        <a class="icon-btn" href="#lista" aria-label="Lista de consulta">${ic('clipboard-list')}<span class="badge" data-count="list"></span></a>
        <a class="btn btn-wa btn-sm only-d" href="${waLink(waGeneralMsg())}" target="_blank" rel="noopener" data-wa="general">${ic('message-circle')}WhatsApp</a>
      </div>
    </div>
    <div class="wrap m-search" id="m-search" hidden><form class="search" role="search" onsubmit="return false">${ic('search')}<input id="m-q" type="search" placeholder="SKU o palabra clave" aria-label="Buscar por SKU o palabra clave" data-input="q" autocomplete="off"></form></div>
    <div class="cats-bar only-d"><div class="wrap">${cats().filter(c=>c.active).map(c=>`<a href="#${c.id==='ofertas'?'ofertas':'categoria-'+c.id}" class="${c.virtual?'promo':''}">${esc(c.name)}</a>`).join('')}</div></div>`;
  $('#ftr').innerHTML = `<div class="wrap">
    <div class="ftr-grid">
      <div><div class="logo" style="margin-bottom:12px">${logoImg()}</div><p style="max-width:34ch">Catálogo digital del bazar. Las consultas y compras se coordinan por WhatsApp.</p></div>
      <div><h4>Categorías</h4><ul>${cats().filter(c=>c.active&&!c.virtual).slice(0,7).map(c=>`<li><a href="#categoria-${c.id}">${esc(c.name)}</a></li>`).join('')}</ul></div>
      <div><h4>Atención</h4><ul><li>${esc(st.hours)}</li><li>WhatsApp <span class="mono">+${esc(waNum())}</span></li></ul></div>
      <div><h4>Seguinos</h4><ul><li>Instagram ${esc(st.instagram)}</li><li>Facebook ${esc(st.facebook)}</li><li><a href="${PDF_URL}" target="_blank" rel="noopener">Catálogo en PDF</a></li><li><a href="#admin">Panel administrador</a></li></ul></div>
    </div>
    <div class="legal"><span>© 2026 ${esc(st.name)} · Maqueta con datos ficticios.</span><span>Los precios son ilustrativos. No se realizan ventas en línea.</span></div>
  </div>`;
  $('#tabbar').innerHTML = [['inicio','house','Inicio'],['catalogo','layout-grid','Catálogo'],['favoritos','heart','Favoritos'],['lista','clipboard-list','Lista']].map(([h,i,t])=>`<a href="#${h}" data-nav="${h}">${ic(i)}<span>${t}</span>${h==='favoritos'?'<span class="badge" data-count="favs"></span>':h==='lista'?'<span class="badge" data-count="list"></span>':''}</a>`).join('');
  $('#wa-float').href = waLink(waGeneralMsg());
  ['hdr-q','m-q'].forEach(id=>{const el=document.getElementById(id); if(el) el.value=S.f.q;});
  updateCounts(); markNav(); icons();
}
function updateCounts(){
  const nList = S.list.reduce((a,i)=>a+i.qty,0), nFav = S.favs.length;

const skeletonGrid = n => `<div class="result-meta"><span class="sk" style="width:120px;height:14px;display:block;border-radius:4px"></span></div><div class="grid" aria-busy="true" aria-label="Cargando productos">${Array.from({length:n},()=>`<div class="sk-card"><div class="sk a"></div><div class="sk b"></div><div class="sk c"></div></div>`).join('')}</div>`;
function filtered(){
  const f = S.f, q = slugify(f.q).replace(/-/g,' ');
  const min = parseInt(String(f.min).replace(/\D/g,''))||0, max = parseInt(String(f.max).replace(/\D/g,''))||0;
  let r = pub().filter(p=>{
    if(q){ const hay = slugify(`${p.name} ${p.sku} ${catById(p.cat)?.name} ${p.materials} ${p.variants.join(' ')}`).replace(/-/g,' '); if(!q.split(' ').every(w=>hay.includes(w))) return false; }
    if(f.cats.length && !f.cats.some(c=>inCat(p,c))) return false;
    if(f.avail.length && !f.avail.includes(p.avail)) return false;
    if((min||max) && S.data.settings.showPrices){ if(!priceShown(p)) return false; if(min && p.price<min) return false; if(max && p.price>max) return false; }
    return true;
  });
  const s = f.sort, qs = f.q.trim().toUpperCase();
  r.sort((a,b)=> (b.sku===qs) - (a.sku===qs));
  if(qs && r[0] && r[0].sku===qs) return [r[0], ...r.slice(1).sort(cmp)];
  return r.sort(cmp);
  function cmp(a,b){ return (a,b)=> s==='nombre'?a.name.localeCompare(b.name,'es') : s==='precio-asc'?a.price-b.price : s==='precio-desc'?b.price-a.price : b.added.localeCompare(a.added); }
}
function renderResults(){
  const box = $('#results'); if(!box) return;
  const r = filtered(), f = S.f, shown = r.slice(0,S.shown);
  const chips = [
    ...(f.q?[[`“${f.q}”`,'q','']]:[]),
    ...f.cats.map(c=>[catById(c)?.name||c,'cat',c]),
    ...f.avail.map(a=>[AV[a],'avail',a]),
    ...(f.min?[[`Desde ${money(+String(f.min).replace(/\D/g,'')||0)}`,'min','']]:[]),
    ...(f.max?[[`Hasta ${money(+String(f.max).replace(/\D/g,'')||0)}`,'max','']]:[])
  ];
  box.innerHTML = `
    <div class="result-meta"><span><b>${r.length}</b> producto${r.length===1?'':'s'}</span>
      ${chips.length?`<div class="chips">${chips.map(c=>`<button class="chip" data-action="f-remove" data-k="${c[1]}" data-v="${esc(c[2])}" aria-label="Quitar filtro ${esc(c[0])}">${esc(c[0])}${ic('x')}</button>`).join('')}<button class="link-btn" data-action="f-clear" style="font-size:13px">Limpiar todo</button></div>`:''}
    </div>
    ${r.length ? grid(shown) : empty('search-x','No encontramos productos con esos filtros', f.q?`Probá con otra palabra o revisá la ortografía de “${esc(f.q)}”. También podés consultarnos: puede que lo tengamos aunque no esté en la web.`:'Probá quitando algún filtro.', `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn btn-ghost" data-action="f-clear">Quitar filtros</button><a class="btn btn-wa" href="${waLink(f.q?`Hola, ¿tienen ${f.q}?`:waGeneralMsg())}" target="_blank" rel="noopener" data-wa="general">${ic('message-circle')}Preguntar por WhatsApp</a></div>`)}
    ${r.length>S.shown?`<div class="load-more"><span>Mostrando ${shown.length} de ${r.length}</span><div class="progress"><i style="width:${shown.length/r.length*100}%"></i></div><button class="btn btn-ghost" data-action="more">Cargar más productos</button></div>`:(r.length>12?`<div class="load-more"><span>Viste los ${r.length} productos</span></div>`:'')}`;
  const ap = $('#f-apply'); if(ap) ap.textContent = `Ver ${r.length} producto${r.length===1?'':'s'}`;
  icons();
}

  const ph = S.admin.draftPhotos;
  if(ph.length) return ph.map((src,i)=>`<div><img src="${src}" alt="Imagen ${i+1}"></div>`).join('');
  return p.sku ? [0,1,2].map(i=>`<div>${art(p,i,false)}</div>`).join('') + '<span class="hint" style="align-self:center">Imágenes ilustrativas</span>' : '<span class="hint">Sin imágenes</span>';
}

/* ==========================================================================
   ROUTER
   ========================================================================== */
function route(){
  const h = (location.hash||'#inicio').slice(1);
  if(h.startsWith('producto-')) return {name:'producto', slug:h.slice(9)};
  if(h.startsWith('categoria-')) return {name:'catalogo', cat:h.slice(10)};
  if(h==='ofertas') return {name:'catalogo', cat:'ofertas'};
  if(['catalogo','lista','favoritos','admin','contacto','personalizados','faq'].includes(h)) return {name:h};
  return {name:'inicio'};
}
let lastRoute = '';
function render(opts={}){
  const r = route(), main = $('#main'), key = location.hash;
  document.body.classList.toggle('is-admin', r.name==='admin');
  if(r.name==='catalogo' && r.cat && key!==lastRoute){ S.f.cats=[r.cat]; S.shown=12; track('cats', r.cat); }
  if(r.name==='producto' && key!==lastRoute){ S.pdp={img:0,variant:'',qty:1}; const p=prodBySlug(r.slug); if(p) track('views', p.sku); }
  const html = ['inicio','contacto','personalizados','faq'].includes(r.name) ? pageHome() : r.name==='catalogo' ? pageCatalog() : r.name==='producto' ? pageProduct(r.slug) : r.name==='lista' ? pageList() : r.name==='favoritos' ? pageFavs() : pageAdmin();
  main.innerHTML = html;
  if(r.name==='catalogo'){ if(key!==lastRoute && !opts.keep){ setTimeout(renderResults, 280); } else renderResults(); }
  const changed = key!==lastRoute; lastRoute = key;
  markNav(); icons();
  if(changed && !opts.keep){
    if(['contacto','personalizados','faq'].includes(r.name)){ requestAnimationFrame(()=>document.getElementById(r.name+'-sec')?.scrollIntoView({behavior:'smooth'})); }
    else window.scrollTo({top:0,behavior:'instant'});
  }
  document.title = r.name==='producto' ? `${prodBySlug(r.slug)?.name||'Producto'} | ${S.data.settings.name}` : r.name==='catalogo' ? `${S.f.cats.length===1?catById(S.f.cats[0])?.name:'Catálogo'} | ${S.data.settings.name}` : S.data.settings.name;
}
function track(kind, k){ S.ev[kind][k] = (S.ev[kind][k]||0)+1; }

/* ==========================================================================
   ACCIONES
   ========================================================================== */
function saveList(){ store.set('list', S.list); updateCounts(); }
function toast(text, link){ const t=$('#toast'); t.innerHTML=`<span>${text}</span>${link?`<a href="${link[1]}">${link[0]}</a>`:''}`; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2800); }
function openDrawer(html, side=''){ const d=$('#drawer'); d.className='drawer '+side; d.innerHTML=html; d.setAttribute('aria-hidden','false'); requestAnimationFrame(()=>{d.classList.add('open');$('#drawer-bg').classList.add('open')}); icons(); setTimeout(()=>d.querySelector('input,button')?.focus(),300); }
function closeDrawer(){ const d=$('#drawer'); d.classList.remove('open'); $('#drawer-bg').classList.remove('open'); d.setAttribute('aria-hidden','true'); }
function rerenderAdmin(){ const m=$('#adm-main'); if(m){ m.innerHTML=admSection(S.admin.tab); icons(); } }

document.addEventListener('click', e=>{

    case 'close-drawer': closeDrawer(); break;
    case 'm-search': { const m=$('#m-search'); m.hidden=!m.hidden; if(!m.hidden) $('#m-q').focus(); break; }
    case 'fav': { const i=S.favs.indexOf(sku); if(i>-1) S.favs.splice(i,1); else S.favs.push(sku); store.set('favs',S.favs); updateCounts();
      el.classList.toggle('on', i===-1); el.setAttribute('aria-pressed', i===-1); el.setAttribute('aria-label', (i===-1?'Quitar de':'Agregar a')+' favoritos');

      if(route().name==='favoritos') render({keep:true}); break; }
    case 'add': { const p=prodBySku(sku); const fromPdp = el.dataset.from==='pdp'; const variant = fromPdp ? (S.pdp.variant||p.variants[0]||'') : (p.variants[0]||''); const qty = fromPdp ? S.pdp.qty : 1;
      const it = S.list.find(x=>x.sku===sku && x.variant===variant); if(it) it.qty+=qty; else S.list.push({sku,variant,qty}); saveList();
      toast(`${esc(p.name)} agregado a tu lista`, ['Ver lista','#lista']); break; }

    case 'remove': { const [s,v]=el.dataset.key.split('|'); S.list=S.list.filter(x=>!(x.sku===s&&x.variant===v)); saveList(); render({keep:true}); toast('Producto quitado de la lista'); break; }

    case 'clear-yes': S.list=[]; S.confirmClear=false; saveList(); render({keep:true}); break;
    case 'copy': { const txt=waListMsg(); const done=()=>toast('Mensaje copiado'); try{ navigator.clipboard.writeText(txt).then(done,()=>selectMsg()); }catch(err){ selectMsg(); } break; }
    case 'gal': S.pdp.img=+el.dataset.i; { const p=prodBySlug(route().slug); $('#main-img').innerHTML=art(p,S.pdp.img); document.querySelectorAll('.thumbs button').forEach((b,i)=>b.setAttribute('aria-current', i===S.pdp.img)); } break;
    case 'variant': S.pdp.variant=el.dataset.v; { const y=window.scrollY; render({keep:true}); window.scrollTo(0,y); } break;
    case 'pqty': S.pdp.qty=Math.max(1,Math.min(99,S.pdp.qty+ +el.dataset.d)); $('#pqty').textContent=S.pdp.qty; break;
    case 'more': S.shown+=12; renderResults(); break;
    case 'sort-new': S.f.sort='novedades'; break;
    case 'toggle-filters': $('#filters')?.classList.toggle('open'); $('#sheet-bg')?.classList.toggle('open'); break;
    case 'f-clear': S.f={q:'',cats:[],avail:[],min:'',max:'',sort:S.f.sort}; S.shown=12; ['hdr-q','m-q'].forEach(id=>{const x=document.getElementById(id); if(x) x.value='';}); if(location.hash!=='#catalogo'){ lastRoute='#catalogo'; location.hash='catalogo'; render({keep:true}); } else render({keep:true}); break;
    case 'f-remove': { const k=el.dataset.k, v=el.dataset.v; if(k==='q'){S.f.q='';['hdr-q','m-q','cat-q'].forEach(id=>{const x=document.getElementById(id); if(x) x.value='';});} if(k==='cat') S.f.cats=S.f.cats.filter(c=>c!==v); if(k==='avail') S.f.avail=S.f.avail.filter(c=>c!==v); if(k==='min'){S.f.min=''; const x=$('#f-min'); if(x)x.value='';} if(k==='max'){S.f.max=''; const x=$('#f-max'); if(x)x.value='';}
      document.querySelectorAll(`[data-change="f-${k}"][value="${v}"]`).forEach(c=>c.checked=false); S.shown=12; renderResults(); break; }
    /* admin */
    case 'adm-out': S.admin.in=false; try{sessionStorage.removeItem('ejb:adm')}catch(e){} render({keep:true}); break;
    case 'adm-tab': S.admin.tab=el.dataset.t; render({keep:true}); break;
    case 'adm-feat': { const p=prodBySku(sku); p.featured=!p.featured; rerenderAdmin(); toast(p.featured?'Marcado como destacado (vista previa)':'Quitado de destacados (vista previa)'); break; }
    case 'adm-avail': { const p=prodBySku(sku); p.avail=el.dataset.v; rerenderAdmin(); toast(`${esc(p.name)}: ${AV[p.avail]} (vista previa)`); break; }
    case 'adm-edit': openDrawer(productForm(sku?prodBySku(sku):null)); break;
    case 'adm-save': saveProductForm(); break;
    case 'adm-archive': { const p=prodBySku(sku); p.archived=!p.archived; if(p.archived) p.visible=false; else p.visible=true; closeDrawer(); rerenderAdmin(); toast(p.archived?'Producto archivado en la vista previa':'Producto desarchivado en la vista previa'); break; }
    case 'adm-del': { const box=$('#danger'); box.innerHTML=`<div class="confirm" style="width:100%"><span>¿Eliminar <b>${esc(prodBySku(sku).name)}</b> de la vista previa? Al recargar la página vuelve a aparecer.</span><div><button type="button" class="btn btn-sm" style="background:var(--bad);color:var(--surface)" data-action="adm-del-yes" data-sku="${sku}">Eliminar</button><button type="button" class="btn btn-ghost btn-sm" data-action="close-drawer">Cancelar</button></div></div>`; break; }
    case 'adm-del-yes': { const p=prodBySku(sku); p.deleted=true; p.visible=false; p.archived=true; S.list=S.list.filter(x=>x.sku!==sku); saveList(); closeDrawer(); rerenderAdmin(); toast('Producto eliminado de la vista previa'); break; }
    case 'cat-mv': { const i=+el.dataset.i, j=i+ +el.dataset.d, C=cats(); if(j<0||j>=C.length) break; [C[i],C[j]]=[C[j],C[i]]; renderShell(); rerenderAdmin(); break; }
    case 'faq-add': S.data.faq.push({q:'Nueva pregunta',a:'Escribí la respuesta.'}); rerenderAdmin(); document.getElementById('fq-'+(S.data.faq.length-1))?.focus(); break;
    case 'faq-del': S.data.faq.splice(+el.dataset.i,1); rerenderAdmin(); toast('Pregunta eliminada de la vista previa'); break;
    case 'faq-mv': { const i=+el.dataset.i, j=i+ +el.dataset.d, F=S.data.faq; if(j<0||j>=F.length) break; [F[i],F[j]]=[F[j],F[i]]; rerenderAdmin(); break; }
    case 'cat-new': { const n=cats().length+1; const id='nueva-'+n; cats().push({id,name:'Nueva categoría',active:false,cover:''}); rerenderAdmin(); toast('Categoría creada inactiva. Poné un nombre y activala.'); break; }
  }
});
function selectMsg(){ const m=$('#msg'); if(!m) return; const r=document.createRange(); r.selectNodeContents(m); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texto seleccionado: copialo con Ctrl+C'); }

document.addEventListener('input', e=>{
  const k = e.target.dataset.input; if(!k) return;
  if(k==='q'){ S.f.q=e.target.value; S.shown=12; ['hdr-q','m-q','cat-q'].forEach(id=>{const x=document.getElementById(id); if(x&&x!==e.target) x.value=S.f.q;});
    if(route().name!=='catalogo'){ if(S.f.q.trim()){ S.f.cats=[]; lastRoute='#catalogo'; location.hash='catalogo'; render({keep:true}); window.scrollTo({top:0}); } }
    else renderResults(); }
  if(k==='min'||k==='max'){ S.f[k]=e.target.value; S.shown=12; clearTimeout(window._pt); window._pt=setTimeout(renderResults,250); }
  if(k==='adm-q'){ S.admin.q=e.target.value; const pos=e.target.selectionStart; rerenderAdmin(); const x=$('#adm-q'); x.focus(); x.setSelectionRange(pos,pos); }
});
document.addEventListener('change', e=>{
  const t = e.target, k = t.dataset.change;
  if(t.id==='pf-img'){ const files=[...t.files].slice(0,6); Promise.all(files.map(f=>new Promise(res=>{const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f);}))).then(urls=>{ S.admin.draftPhotos=[...S.admin.draftPhotos,...urls]; const sku=$('#pform').dataset.sku; $('#img-list').innerHTML=imgList(prodBySku(sku)||{sku:''}); }); return; }
  if(!k) return;
  switch(k){
    case 'f-cat': S.f.cats = t.checked ? [...S.f.cats, t.value] : S.f.cats.filter(c=>c!==t.value); if(t.checked) track('cats', t.value); S.shown=12; renderResults(); break;
    case 'f-avail': S.f.avail = t.checked ? [...S.f.avail, t.value] : S.f.avail.filter(c=>c!==t.value); S.shown=12; renderResults(); break;
    case 'sort': S.f.sort=t.value; renderResults(); break;
    case 'adm-vis': { const p=prodBySku(t.value); p.visible=t.checked; if(t.checked) p.archived=false; rerenderAdmin(); toast(t.checked?'Visible en la tienda (vista previa)':'Oculto de la tienda (vista previa)'); break; }
    case 'adm-stock': { const p=prodBySku(t.dataset.sku); const n=parseInt(t.value); if(isNaN(n)||n<0){ t.value=p.stock; toast('El stock tiene que ser un número entero, 0 o mayor'); } else { p.stock=n; toast('Stock actualizado en la vista previa'); } break; }
    case 'adm-feat-c': { const p=prodBySku(t.value); p.featured=t.checked; break; }
    case 'cat-name': { const c=cats()[+t.dataset.i]; const v=t.value.trim(); if(!v){ t.value=c.name; toast('La categoría necesita un nombre'); break; } c.name=v; renderShell(); toast('Nombre actualizado en la vista previa'); break; }
    case 'cat-active': cats()[+t.dataset.i].active=t.checked; renderShell(); break;
    case 'design': S.data.design[t.dataset.k]=t.value; toast('Texto actualizado en la vista previa', ['Ver portada','#inicio']); break;
    case 'faq': { const v=t.value.trim(); if(!v){ toast('Este campo no puede quedar vacío'); t.value=S.data.faq[+t.dataset.i][t.dataset.f]; break; } S.data.faq[+t.dataset.i][t.dataset.f]=v; toast('Pregunta actualizada en la vista previa'); break; }
    case 'hero-p': S.data.design.heroProducts[+t.dataset.i]=t.value; break;
    case 'setting': { const key=t.dataset.k, v=t.value.trim(), err=$('#e-'+key);
      if(key==='whatsapp' && !/^\d{10,15}$/.test(v.replace(/\D/g,'')) ){ err.textContent='Ingresá entre 10 y 15 dígitos, con código de país. Ej: 5491123456789'; break; }
      if(key==='domain' && !/^https?:\/\/[^\s]+\.[^\s]+$/.test(v)){ err.textContent='Ingresá una dirección completa, por ejemplo https://tubazar.com.ar'; break; }
      if(!v && ['name','whatsapp'].includes(key)){ err.textContent='Este dato es obligatorio'; break; }
      err.textContent=''; S.data.settings[key]= key==='whatsapp'? v.replace(/\D/g,'') : v; renderShell(); toast('Dato actualizado en la vista previa'); break; }
    case 'show-prices': S.data.settings.showPrices=t.checked; if(!t.checked && S.f.sort.startsWith('precio')) S.f.sort='novedades'; toast(t.checked?'Precios visibles en la tienda (vista previa)':'Precios ocultos en la tienda (vista previa)'); break;
  }
});
function saveProductForm(){
  const f = $('#pform'), fd = new FormData(f), orig = f.dataset.sku, get = n => (fd.get(n)||'').toString().trim();
  f.querySelectorAll('[data-err]').forEach(x=>x.textContent='');
  let ok = true; const err=(n,m)=>{ f.querySelector(`[data-err="${n}"]`).textContent=m; ok=false; };
  const name=get('name'), sku=get('sku').toUpperCase(), price=get('price').replace(/\D/g,'');
  if(name.length<3) err('name','Escribí un nombre de al menos 3 letras.');
  if(!/^[A-Z0-9-]{2,20}$/.test(sku)) err('sku','Usá entre 2 y 20 letras, números o guiones.');
  else if(S.data.products.some(p=>p.sku===sku && p.sku!==orig && !p.deleted)) err('sku','Ya existe otro producto con este código.');
  if(get('price') && !price) err('price','El precio tiene que ser un número.');
  if(!ok){ f.querySelector('.err:not(:empty)')?.previousElementSibling?.focus(); return; }
  let p = orig ? prodBySku(orig) : null;
  if(!p){ p={kind:'box',color:'#C9BBA4',bg:'#ECE6DB',consultas:0,added:new Date().toISOString().slice(0,10),photos:[]}; S.data.products.push(p); }
  Object.assign(p,{ name, sku, cat:get('cat'), price:+price||0, oldPrice:+get('oldPrice').replace(/\D/g,'')||0, desc:get('desc'), materials:get('materials'), dims:get('dims'),
    variants:get('variants').split(',').map(s=>s.trim()).filter(Boolean), tag:get('tag'), avail:get('avail'), stock:+get('stock').replace(/\D/g,'')||0,
    visible:fd.has('visible'), priceVisible:fd.has('priceVisible'), featured:fd.has('featured'), photos:S.admin.draftPhotos, slug:slugify(name) });
  if(p.visible) p.archived=false;
  if(orig && orig!==sku) S.list.forEach(i=>{ if(i.sku===orig) i.sku=sku; });
  closeDrawer(); rerenderAdmin(); toast(orig?'Cambios aplicados en la vista previa':'Producto creado en la vista previa', p.visible?['Ver en la tienda',`#producto-${p.slug}`]:null);
}
function sha256js(str){const K=[],H=[];let n=2,c=0;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};while(c<64){if(isP(n)){if(c<8)H[c]=(Math.pow(n,1/2)*4294967296)|0;K[c++]=(Math.pow(n,1/3)*4294967296)|0}n++}
  const b=[...new TextEncoder().encode(str)],l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
  const r=(x,y)=>(x>>>y)|(x<<(32-y)),h=H.slice(),w=new Array(64);
  for(let o=0;o<b.length;o+=64){for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let [A,B,C,D,E,F,G,Hh]=h;for(let i=0;i<64;i++){const t1=(Hh+(r(E,6)^r(E,11)^r(E,25))+((E&F)^(~E&G))+K[i]+w[i])|0,t2=((r(A,2)^r(A,13)^r(A,22))+((A&B)^(A&C)^(B&C)))|0;Hh=G;G=F;F=E;E=(D+t1)|0;D=C;C=B;B=A;A=(t1+t2)|0}
    [A,B,C,D,E,F,G,Hh].forEach((v,i)=>h[i]=(h[i]+v)|0)}
  return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('')}
async function sha256(str){ try{ if(window.crypto&&crypto.subtle){ const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''); } }catch(e){} return sha256js(str); }
document.addEventListener('submit', async e=>{
  if(e.target.id!=='adm-login') return;
  e.preventDefault();
  const inp=$('#adm-pass'), err=$('#adm-err'), v=inp.value;
  if(!v){ err.textContent='Ingresá la clave.'; inp.focus(); return; }
  const h=await sha256(v);
  if(h!==ADMIN_HASH){ err.textContent='La clave no es correcta.'; inp.value=''; inp.focus(); return; }
  S.admin.in=true; try{sessionStorage.setItem('ejb:adm',ADMIN_HASH)}catch(x){} render({keep:true});
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeDrawer(); $('#filters')?.classList.remove('open'); $('#sheet-bg')?.classList.remove('open'); } });
window.addEventListener('hashchange', ()=>{ closeDrawer(); render(); });

try{ if(sessionStorage.getItem('ejb:adm')===ADMIN_HASH) S.admin.in=true; }catch(e){}
renderShell(); render();
